<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510">
  <style>text { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif; }</style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="510" fill="#ffffff"/>
  <path d="M 200 174 L 200 470" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <path d="M 500 174 L 500 470" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <path d="M 800 174 L 800 470" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <path d="M 200 230 L 500 230" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="220" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">1. 아이디·비밀번호 입력</text>
  <path d="M 500 290 L 800 290" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="280" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">2. 인증 요청</text>
  <path d="M 800 350 L 500 350" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="650" y="340" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">3. 인증 결과</text>
  <path d="M 500 410 L 200 410" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="350" y="400" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">4. 로그인 결과 화면</text>
  <rect x="100" y="110" width="200" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="148" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">사용자</text>
  <rect x="400" y="110" width="200" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="500" y="148" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">웹</text>
  <rect x="700" y="110" width="200" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="800" y="148" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">인증 서버</text>
  <text x="40" y="56" font-size="26" font-weight="700" fill="#0f172a">웹이 인증 서버에 확인한 뒤 로그인 결과를 보여 준다</text>
  <text x="40" y="84" font-size="15" font-weight="400" fill="#475569">로그인 과정 시퀀스 (참여자: 사용자, 웹, 인증 서버)</text>
</svg>
